name: CI

on:
  push:
  pull_request:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for services to become healthy
        run: |
          for attempt in {1..30}; do
            db_status=$(docker inspect -f '{{.State.Health.Status}}' db)
            redis_status=$(docker inspect -f '{{.State.Health.Status}}' redis)
            auth_status=$(docker inspect -f '{{.State.Health.Status}}' auth-service)
            inventory_status=$(docker inspect -f '{{.State.Health.Status}}' inventory-service)
            if [ "$db_status" = healthy ] && [ "$redis_status" = healthy ] && [ "$auth_status" = healthy ] && [ "$inventory_status" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - run: docker compose exec -T inventory-service npm test
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
